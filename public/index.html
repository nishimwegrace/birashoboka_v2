<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birashoboka Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div class="min-h-screen flex flex-col">
        <header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-slate-200">
            <div class="mx-auto flex h-20 items-center justify-between px-4 sm:px-6 lg:px-8">
                <a href="#/" class="flex items-center gap-3">
                    <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-sky-600 text-white text-xl font-bold">B</div>
                    <div>
                        <div class="text-lg font-semibold">Birashoboka</div>
                        <div class="text-xs text-slate-500">Centre pour la réussite</div>
                    </div>
                </a>

                <nav class="hidden flex-1 justify-center gap-6 text-sm font-medium text-slate-700 lg:flex" id="topNav">
                    <a href="#/" class="hover:text-slate-900">Acceuil</a>
                    <a href="#/about" class="hover:text-slate-900">A propos</a>
                    <a href="#/programs" class="hover:text-slate-900">Programmes</a>
                    <a href="#/posts" class="hover:text-slate-900">A la une</a>
                    <a href="#/partners" class="hover:text-slate-900">Partenaires</a>
                    <a href="#/contact" class="hover:text-slate-900">Contact</a>
                </nav>

                <div class="flex items-center gap-3">
                    <a href="#/contact" class="hidden rounded-full bg-sky-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-sky-700 lg:inline-flex">Faire un don</a>
                    <button id="navToggle" class="inline-flex h-11 w-11 items-center justify-center rounded-full border border-slate-200 bg-white text-slate-700 shadow-sm lg:hidden" aria-label="Ouvrir le menu">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                    </button>
                </div>
            </div>
        </header>

        <div class="relative flex-1">
            <aside id="offcanvas" class="fixed inset-y-0 right-0 z-50 w-72 translate-x-full overflow-y-auto bg-white p-6 shadow-2xl transition duration-300 lg:hidden">
                <div class="mb-6 flex items-center justify-between">
                    <div class="text-lg font-semibold">Menu</div>
                    <button id="closeOffcanvas" aria-label="Fermer le menu" class="text-2xl text-slate-700">×</button>
                </div>
                <nav class="flex flex-col gap-4 text-base text-slate-800">
                    <a href="#/">Acceuil</a>
                    <a href="#/about">A propos</a>
                    <a href="#/programs">Programmes</a>
                    <a href="#/posts">A la une</a>
                    <a href="#/partners">Partenaires</a>
                    <a href="#/contact">Contact</a>
                </nav>
            </aside>
            <div id="pageOverlay" class="fixed inset-0 z-40 hidden bg-slate-900/40 lg:hidden"></div>

            <main id="app" class="mx-auto w-full max-w-7xl px-4 py-10 sm:px-6 lg:px-8"></main>
        </div>

        <footer class="border-t border-slate-200 bg-white px-4 py-6 text-sm text-slate-600 sm:px-6 lg:px-8">
            <div class="flex flex-col gap-1 sm:flex-row sm:justify-between">
                <span>© <span id="currentYear"></span> Birashoboka Center. Tous droits réservés.</span>
                <span>API et site servis depuis le même hébergement.</span>
            </div>
        </footer>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
